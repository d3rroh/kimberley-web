name: Build and Deploy

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: d3rroh/kimberley-web

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Only the tag: anything containing the Docker Hub username is masked as a secret
      tag: ${{ steps.short.outputs.sha }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # Don't write the job token into .git/config
          persist-credentials: false

      - name: Short SHA
        id: short
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    env:
      # Deploys only once this secret exists (base64 kubeconfig for the k3s
      # cluster); until then the workflow just builds and pushes.
      HAS_KUBECONFIG: ${{ secrets.KUBECONFIG_B64 != '' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'kimberley-web' }}
      K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT || 'kimberley-web' }}
      K8S_CONTAINER: ${{ vars.K8S_CONTAINER || 'web' }}
    steps:
      - name: Deploy to k3s
        if: env.HAS_KUBECONFIG == 'true'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
        run: |
          install -m 700 -d ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl -n "$K8S_NAMESPACE" set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$IMAGE_REF"
          kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$K8S_DEPLOYMENT" --timeout=120s

      - name: Skip deploy
        if: env.HAS_KUBECONFIG != 'true'
        run: echo "::notice::KUBECONFIG_B64 is not set; image pushed but not deployed (see deploy/README.md)"

      - name: Check live site
        if: env.HAS_KUBECONFIG == 'true'
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://kimberley.name.ng/) && [ "$code" = 200 ] && exit 0
            sleep 5
          done
          echo "Live site returned $code"; exit 1

      - name: Remove kubeconfig
        if: always()
        run: rm -f ~/.kube/config
