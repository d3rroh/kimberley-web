server_tokens off;

types {
    application/manifest+json webmanifest;
}

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

map $uri $cache_control {
    default                                  "public, max-age=3600";
    ~*\.html?$                               "no-cache";
    ~^/$                                     "no-cache";
    ~^/assets/fonts/                         "public, max-age=31536000, immutable";
    ~*\.(png|svg|ico|pdf)$                   "public, max-age=604800";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Static site: only GET and HEAD are meaningful
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Never serve dotfiles (.git, .htaccess, ...) except /.well-known
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $cache_control always;
        try_files $uri $uri/ =404;
    }
}
